<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>LANA 妖幣監測</title>
<style>
  :root {
    --bg: #0b0e14; --bg2: #131720; --bg3: #1a2030;
    --acc: #f0b90b; --acc2: #d4a017;
    --green: #0ecb81; --red: #f6465d; --yellow: #f0b90b;
    --text: #eaecef; --muted: #848e9c;
    --radius: 12px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: -apple-system, 'Segoe UI', sans-serif; min-height: 100vh; }

  /* ── Header ── */
  header { background: var(--bg2); border-bottom: 1px solid #2b3046; padding: 14px 16px; display: flex; align-items: center; gap: 10px; position: sticky; top: 0; z-index: 100; }
  header h1 { font-size: 18px; font-weight: 700; color: var(--acc); }
  header span { font-size: 11px; color: var(--muted); margin-left: auto; }

  /* ── Tabs ── */
  .tabs { display: flex; background: var(--bg2); border-bottom: 1px solid #2b3046; }
  .tab { flex: 1; padding: 12px; text-align: center; font-size: 13px; font-weight: 600; color: var(--muted); cursor: pointer; border-bottom: 2px solid transparent; }
  .tab.active { color: var(--acc); border-bottom-color: var(--acc); }

  /* ── Search ── */
  .search-bar { padding: 14px 16px; background: var(--bg2); display: flex; gap: 8px; }
  .search-bar input { flex: 1; background: var(--bg3); border: 1px solid #2b3046; border-radius: 8px; padding: 10px 14px; color: var(--text); font-size: 16px; outline: none; text-transform: uppercase; }
  .search-bar input:focus { border-color: var(--acc); }
  .search-bar input::placeholder { color: var(--muted); text-transform: none; }
  .btn { background: var(--acc); color: #000; border: none; border-radius: 8px; padding: 10px 18px; font-weight: 700; font-size: 14px; cursor: pointer; white-space: nowrap; }
  .btn:active { opacity: 0.8; }
  .btn.secondary { background: var(--bg3); color: var(--text); border: 1px solid #2b3046; }
  .btn.green { background: var(--green); }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }

  /* ── Cards ── */
  .content { padding: 12px 16px; display: flex; flex-direction: column; gap: 10px; }
  .card { background: var(--bg2); border-radius: var(--radius); border: 1px solid #2b3046; overflow: hidden; }
  .card-header { padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #2b3046; }
  .card-header h2 { font-size: 13px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }
  .card-body { padding: 14px 16px; }

  /* ── Price Hero ── */
  .price-hero { padding: 20px 16px; text-align: center; }
  .coin-name { font-size: 22px; font-weight: 700; color: var(--acc); }
  .price-big { font-size: 36px; font-weight: 700; margin: 6px 0; }
  .change-badge { display: inline-block; padding: 4px 12px; border-radius: 20px; font-size: 15px; font-weight: 700; }
  .up { background: rgba(14,203,129,.15); color: var(--green); }
  .down { background: rgba(246,70,93,.15); color: var(--red); }
  .neutral { background: rgba(132,142,156,.15); color: var(--muted); }

  /* ── LANA Score ── */
  .ls-card { background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%); border: 1px solid rgba(255,200,0,0.25); margin-bottom: 12px; }
  .ls-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
  .ls-label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 2px; }
  .ls-grade { font-size: 17px; font-weight: 700; }
  .ls-score-wrap { display: flex; align-items: center; gap: 16px; margin-bottom: 14px; }
  .ls-score-num { font-size: 56px; font-weight: 900; line-height: 1; }
  .ls-bar-wrap { flex: 1; height: 8px; background: rgba(255,255,255,0.08); border-radius: 4px; overflow: hidden; }
  .ls-bar { height: 100%; border-radius: 4px; transition: width 0.8s ease; }
  .ls-breakdown { display: flex; flex-direction: column; gap: 7px; }
  .ls-item { display: flex; align-items: center; gap: 8px; font-size: 12px; }
  .ls-item-label { width: 52px; color: var(--muted); flex-shrink: 0; }
  .ls-mini-bar { flex: 1; height: 5px; background: rgba(255,255,255,0.08); border-radius: 3px; overflow: hidden; }
  .ls-mini-bar div { height: 100%; border-radius: 3px; transition: width 0.8s ease; }
  .ls-item-val { width: 36px; text-align: right; color: var(--muted); flex-shrink: 0; }
  .ls-advice { margin-top: 14px; padding-top: 12px; border-top: 1px solid rgba(255,255,255,0.07); }
  .ls-advice-main { font-size: 13px; font-weight: 600; margin-bottom: 8px; }
  .ls-advice-tips { display: flex; flex-direction: column; gap: 5px; }
  .ls-tip { font-size: 12px; color: var(--muted); line-height: 1.5; padding-left: 4px; }
  .ls-tip strong { color: var(--text); }

  /* ── Risk Badge ── */
  .risk-banner { padding: 10px 16px; font-size: 13px; font-weight: 600; text-align: center; }
  .risk-safe    { background: rgba(14,203,129,.12); color: var(--green); }
  .risk-low     { background: rgba(14,203,129,.08); color: #5bc78a; }
  .risk-medium  { background: rgba(240,185,11,.12); color: var(--yellow); }
  .risk-high    { background: rgba(246,70,93,.12); color: var(--red); }
  .risk-extreme { background: rgba(246,70,93,.2); color: #ff3355; }

  /* ── Grid ── */
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .stat-item { background: var(--bg3); border-radius: 8px; padding: 10px 12px; }
  .stat-label { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 4px; }
  .stat-value { font-size: 16px; font-weight: 700; }
  .stat-value.green { color: var(--green); }
  .stat-value.red   { color: var(--red); }
  .stat-value.yellow{ color: var(--yellow); }
  .stat-value.muted { color: var(--muted); }

  /* ── MA ── */
  .ma-row { display: flex; align-items: center; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #1e2536; }
  .ma-row:last-child { border-bottom: none; }
  .ma-label { font-size: 12px; color: var(--muted); }
  .ma-val { font-size: 13px; font-weight: 600; }
  .ma-diff { font-size: 11px; }

  /* ── Gauge ── */
  .gauge-wrap { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .gauge-bar { width: 100%; height: 8px; border-radius: 4px; background: #2b3046; overflow: hidden; }
  .gauge-fill { height: 100%; border-radius: 4px; transition: width .4s; }
  .gauge-labels { display: flex; justify-content: space-between; width: 100%; font-size: 10px; color: var(--muted); }
  .gauge-value { font-size: 22px; font-weight: 700; }

  /* ── Risk List ── */
  .risk-item { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-bottom: 1px solid #1e2536; font-size: 13px; }
  .risk-item:last-child { border-bottom: none; }
  .risk-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .dot-red { background: var(--red); }
  .dot-green { background: var(--green); }

  /* ── Scan List ── */
  .scan-row { display: flex; align-items: center; padding: 10px 0; border-bottom: 1px solid #1e2536; cursor: pointer; }
  .scan-row:last-child { border-bottom: none; }
  .scan-row:active { opacity: 0.7; }
  .scan-zone { width: 6px; height: 36px; border-radius: 3px; margin-right: 12px; flex-shrink: 0; }
  .zone-green  { background: var(--green); }
  .zone-yellow { background: var(--yellow); }
  .zone-red    { background: var(--red); }
  .scan-info { flex: 1; }
  .scan-coin { font-size: 15px; font-weight: 700; }
  .scan-vol { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .scan-right { text-align: right; }
  .scan-chg { font-size: 16px; font-weight: 700; }
  .scan-price { font-size: 13px; font-weight: 600; color: var(--text); margin-top: 3px; }

  /* ── Loading ── */
  .loading { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 40px 16px; color: var(--muted); font-size: 14px; }
  .spinner { width: 36px; height: 36px; border: 3px solid #2b3046; border-top-color: var(--acc); border-radius: 50%; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── Toast ── */
  .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: var(--bg3); border: 1px solid #2b3046; border-radius: 20px; padding: 10px 20px; font-size: 13px; z-index: 999; opacity: 0; transition: opacity .3s; pointer-events: none; }
  .toast.show { opacity: 1; }

  /* ── Watchlist Buttons ── */
  .btn-star { background: none; border: none; font-size: 18px; cursor: pointer; padding: 4px 2px; line-height: 1; flex-shrink: 0; }
  .btn-remove { background: none; border: none; color: var(--muted); font-size: 16px; font-weight: 700; cursor: pointer; padding: 4px 6px; flex-shrink: 0; }
  .btn-remove:active { color: var(--red); }
  .wl-add-bar { padding: 10px 16px; background: var(--bg2); display: flex; gap: 8px; border-bottom: 1px solid #2b3046; }
  .wl-add-bar input { flex: 1; background: var(--bg3); border: 1px solid #2b3046; border-radius: 8px; padding: 8px 12px; color: var(--text); font-size: 14px; outline: none; text-transform: uppercase; }
  .wl-add-bar input:focus { border-color: var(--acc); }

  /* ── Pages ── */
  .page { display: none; }
  .page.active { display: block; }
  .empty { padding: 40px 16px; text-align: center; color: var(--muted); font-size: 14px; }
  .empty-icon { font-size: 36px; margin-bottom: 8px; }
  .ts-label { font-size: 11px; color: var(--muted); padding: 0 16px 8px; }

  /* ── 4 tabs ── */
  .tabs { overflow-x: auto; white-space: nowrap; }
  .tab  { padding: 11px 6px; font-size: 12px; }

  /* ── Journal ── */
  .jform-card { background:var(--bg2); border-radius:var(--radius); border:1px solid #2b3046; padding:14px 16px; margin:12px 16px 0; }
  .jform-title { font-size:13px; font-weight:700; color:var(--acc); margin-bottom:12px; }
  .jform-row { display:flex; flex-direction:column; gap:5px; margin-bottom:10px; }
  .jform-label { font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.05em; }
  .jform-select, .jform-input { background:var(--bg3); border:1px solid #2b3046; border-radius:8px; padding:9px 12px; color:var(--text); font-size:14px; outline:none; width:100%; }
  .jform-select:focus, .jform-input:focus { border-color:var(--acc); }
  .jform-textarea { background:var(--bg3); border:1px solid #2b3046; border-radius:8px; padding:9px 12px; color:var(--text); font-size:14px; outline:none; width:100%; resize:none; min-height:64px; }
  .jform-preview { background:var(--bg3); border-radius:8px; padding:8px 12px; font-size:12px; color:var(--muted); margin-bottom:10px; min-height:28px; }
  .jentry { background:var(--bg2); border-radius:var(--radius); border:1px solid #2b3046; padding:12px 14px; margin:8px 16px 0; }
  .jentry-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; }
  .jentry-coin { font-size:15px; font-weight:700; }
  .jentry-ts   { font-size:11px; color:var(--muted); }
  .jentry-body { font-size:12px; color:var(--muted); line-height:1.7; }
  .jentry-result { display:flex; align-items:center; gap:8px; margin-top:8px; padding-top:8px; border-top:1px solid #1e2536; font-size:12px; }
  .jentry-decision { font-size:13px; font-weight:700; }
  .badge-sentiment { display:inline-block; padding:2px 8px; border-radius:10px; font-size:11px; font-weight:700; }
  .sent-buy    { background:rgba(14,203,129,.15); color:var(--green); }
  .sent-watch  { background:rgba(240,185,11,.12); color:var(--yellow); }
  .sent-fear   { background:rgba(246,70,93,.12); color:var(--red); }
  .sent-high   { background:rgba(132,142,156,.12); color:var(--muted); }
  .pending-badge { font-size:11px; color:var(--muted); background:var(--bg3); border-radius:8px; padding:2px 7px; }

  /* ── Position Calc ── */
  .pos-input-row { display:flex; gap:8px; margin-bottom:10px; }
  .pos-input-row input, .pos-input-row select { flex:1; background:var(--bg3); border:1px solid #2b3046; border-radius:8px; padding:9px 12px; color:var(--text); font-size:14px; outline:none; }
  .pos-input-row input:focus, .pos-input-row select:focus { border-color:var(--acc); }
  .pos-result-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:10px; }
  .pos-item { background:var(--bg3); border-radius:8px; padding:9px 12px; }
  .pos-label { font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:.05em; margin-bottom:3px; }
  .pos-val { font-size:15px; font-weight:700; }
  .pos-rr  { text-align:center; background:rgba(240,185,11,.1); border-radius:8px; padding:8px; font-size:13px; font-weight:700; color:var(--acc); margin-bottom:10px; }

  /* ── Back Bar ── */
  .back-bar { display:flex; align-items:center; background:var(--bg2); border-bottom:1px solid #2b3046; padding:10px 14px; gap:10px; position:sticky; top:52px; z-index:50; }
  .back-btn { background:none; border:none; color:var(--acc); font-size:18px; cursor:pointer; padding:2px 6px 2px 2px; line-height:1; display:flex; align-items:center; gap:4px; }
  .back-btn span { font-size:13px; font-weight:600; }
  .back-coin-title { font-size:14px; font-weight:700; color:var(--text); }
</style>
</head>
<body>

<header>
  <div style="font-size:20px">🚨</div>
  <h1>LANA 妖幣監測</h1>
  <span id="hdrTime"></span>
</header>

<div class="tabs">
  <div class="tab active" onclick="switchTab('scan')">市場掃描</div>
  <div class="tab" onclick="switchTab('analyze')">深度分析</div>
  <div class="tab" onclick="switchTab('watchlist')">觀察名單</div>
  <div class="tab" onclick="switchTab('journal')">📔 日誌</div>
</div>

<!-- ── 市場掃描 ── -->
<div id="page-scan" class="page active">
  <div style="padding:12px 16px;background:var(--bg2);display:flex;gap:8px;border-bottom:1px solid #2b3046;flex-wrap:wrap">
    <button class="btn" onclick="loadScan()" id="btnScan">🔍 掃描全市場</button>
    <button class="btn secondary" onclick="loadScan()" id="btnRefresh" style="display:none">重新整理</button>
    <button class="btn" id="btnTgScan" style="background:#229ED9;display:none" onclick="sendScanTelegram()">✈️ 推播</button>
    <div id="scanTs" class="ts-label" style="display:flex;align-items:center;margin-left:auto"></div>
  </div>
  <div id="scanResult">
    <div class="empty"><div class="empty-icon">📡</div>點擊「掃描全市場」<br>抓取即時妖幣清單</div>
  </div>
</div>

<!-- ── 深度分析 ── -->
<div id="page-analyze" class="page">
  <div class="search-bar">
    <input type="text" id="coinInput" placeholder="輸入幣名，例如 BIO" maxlength="12" autocomplete="off" autocorrect="off" autocapitalize="characters" spellcheck="false" onkeydown="if(event.key==='Enter')runAnalyze()">
    <button class="btn" onclick="runAnalyze()" id="btnAnalyze">分析</button>
  </div>
  <div id="analyzeResult">
    <div class="empty"><div class="empty-icon">🔍</div>輸入幣種代號<br>例如 BIO、ORDI、ORCA</div>
  </div>
</div>

<!-- ── 觀察名單 ── -->
<div id="page-watchlist" class="page">
  <div class="wl-add-bar">
    <input type="text" id="wlInput" placeholder="輸入幣名新增，例如 SOL" maxlength="12" autocomplete="off" autocorrect="off" autocapitalize="characters" spellcheck="false" onkeydown="if(event.key==='Enter')addCoinToWatchlist()">
    <button class="btn" onclick="addCoinToWatchlist()">＋ 新增</button>
  </div>
  <div id="watchlistContent">
    <div class="content">
      <div class="card">
        <div class="card-header"><h2>👁 追蹤中</h2></div>
        <div class="card-body">
          <div id="wlRows"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- ── 交易日誌 ── -->
<div id="page-journal" class="page">
  <!-- 新增紀錄表單 -->
  <div class="jform-card">
    <div class="jform-title">✍️ 新增今日觀察</div>

    <div class="jform-row">
      <span class="jform-label">幣種</span>
      <select id="jCoin" class="jform-select" onchange="jFetchPreview()">
        <option value="">— 選擇幣種 —</option>
      </select>
    </div>

    <div class="jform-row">
      <span class="jform-label">當下感覺</span>
      <select id="jSentiment" class="jform-select">
        <option value="">— 選擇情緒 —</option>
        <option value="很想買">🔥 很想買</option>
        <option value="觀望">👀 觀望</option>
        <option value="怕了">😨 怕了</option>
        <option value="已經漲太多">😤 已經漲太多</option>
      </select>
    </div>

    <div class="jform-row">
      <span class="jform-label">沒下單的原因（選填）</span>
      <textarea id="jReason" class="jform-textarea" placeholder="例如：量能還沒放大、等回踩均線..."></textarea>
    </div>

    <div id="jPreview" class="jform-preview">選幣後自動帶入 LANA Score 與現價</div>

    <button class="btn" style="width:100%" id="jSubmitBtn" onclick="submitJournal()">📝 記錄下來</button>
  </div>

  <!-- 日誌列表 -->
  <div style="display:flex;justify-content:space-between;align-items:center;padding:12px 16px 4px">
    <span style="font-size:13px;font-weight:700;color:var(--acc)">📋 歷史紀錄</span>
    <div style="display:flex;gap:8px">
      <button class="btn secondary" style="font-size:12px;padding:6px 12px" onclick="validateJournal()">🔄 驗證24h</button>
      <button class="btn" style="font-size:12px;padding:6px 12px;background:#229ED9" onclick="sendWeeklyReport()">✈️ 週報</button>
    </div>
  </div>
  <div id="journalList" style="padding-bottom:20px">
    <div class="empty"><div class="empty-icon">📔</div>尚無紀錄<br><small style="color:var(--muted)">寫下你今天注意到的幣</small></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ── 觀察名單 API 管理 ────────────────────────────────────
let _watchlist = [];  // in-memory cache（由 fetchWatchlist 初始化）

async function fetchWatchlist() {
  try {
    const r = await fetch('/api/watchlist');
    const j = await r.json();
    _watchlist = j.ok ? j.coins : [];
  } catch { _watchlist = []; }
  return _watchlist;
}
function getWatchlist()   { return _watchlist; }
function isInWL(coin)     { return _watchlist.includes(coin.toUpperCase()); }

async function _apiPost(url, coin) {
  try {
    const r = await fetch(url, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({coin: coin.toUpperCase()})
    });
    const j = await r.json();
    if (j.ok) _watchlist = j.coins;
    return j.ok;
  } catch { return false; }
}

function _refreshStarBtns() {
  document.querySelectorAll('[data-wl-coin]').forEach(btn => {
    const c = btn.dataset.wlCoin;
    const inWl = isInWL(c);
    btn.textContent = inWl ? '⭐' : '☆';
    btn.title = inWl ? '移除觀察' : '加入觀察';
  });
}

async function toggleWatchlist(coin, btn) {
  coin = coin.toUpperCase();
  if (isInWL(coin)) {
    await _apiPost('/api/watchlist/remove', coin);
    toast(`移除觀察：${coin}`);
  } else {
    await _apiPost('/api/watchlist/add', coin);
    toast(`⭐ 加入觀察：${coin}`);
  }
  if (btn) { btn.textContent = isInWL(coin) ? '⭐' : '☆'; btn.title = isInWL(coin) ? '移除觀察' : '加入觀察'; }
  _refreshStarBtns();
  // 若觀察名單頁是開著的，刷新
  if (document.getElementById('page-watchlist').classList.contains('active')) loadWatchlist();
  // 更新分析頁的觀察按鈕
  const ab = document.querySelector('[data-analyze-wl]');
  if (ab && ab.dataset.analyzeWl === coin) ab.textContent = isInWL(coin) ? '⭐ 觀察中' : '☆ 加入觀察';
}

async function removeFromWatchlist(coin) {
  await _apiPost('/api/watchlist/remove', coin);
  toast(`移除觀察：${coin}`);
  _refreshStarBtns();
  loadWatchlist();
}

async function addCoinToWatchlist() {
  const coin = document.getElementById('wlInput').value.trim().toUpperCase();
  if (!coin) return;
  if (isInWL(coin)) { toast(`${coin} 已在觀察名單`); return; }
  const ok = await _apiPost('/api/watchlist/add', coin);
  if (ok) {
    document.getElementById('wlInput').value = '';
    toast(`⭐ 已新增：${coin}`);
    loadWatchlist();
  }
}

function fmt(v) {
  if (!v && v !== 0) return "—";
  if (v >= 1e9) return `$${(v/1e9).toFixed(1)}B`;
  if (v >= 1e6) return `$${(v/1e6).toFixed(1)}M`;
  if (v >= 1e3) return `$${(v/1e3).toFixed(0)}K`;
  return `$${v}`;
}
function fmtPrice(v) {
  if (!v) return "—";
  if (v < 0.001) return `$${v.toFixed(6)}`;
  if (v < 1)     return `$${v.toFixed(4)}`;
  if (v < 100)   return `$${v.toFixed(3)}`;
  return `$${v.toFixed(2)}`;
}
function chgClass(v) { return v > 0 ? "green" : v < 0 ? "red" : "muted"; }
function chgStr(v)   { return v == null ? "—" : (v >= 0 ? `+${v.toFixed(2)}%` : `${v.toFixed(2)}%`); }

function switchTab(t) {
  document.querySelectorAll(".tab").forEach(el => el.classList.remove("active"));
  document.querySelectorAll(".page").forEach(el => el.classList.remove("active"));
  event.target.classList.add("active");
  document.getElementById(`page-${t}`).classList.add("active");
  if (t === "watchlist") loadWatchlist();
  if (t === "journal")   initJournalPage();
}

function toast(msg, dur=2500) {
  const el = document.getElementById("toast");
  el.textContent = msg; el.classList.add("show");
  setTimeout(() => el.classList.remove("show"), dur);
}

// ── 市場掃描 ──────────────────────────────────────────────
async function loadScan() {
  const el = document.getElementById("scanResult");
  el.innerHTML = `<div class="loading"><div class="spinner"></div>掃描全市場中...</div>`;
  document.getElementById("btnScan").disabled = true;
  try {
    const res = await fetch("/api/scan");
    const json = await res.json();
    if (!json.ok) throw new Error(json.error);
    // 同步後端回傳的最新 watchlist
    if (json.watchlist) _watchlist = json.watchlist;
    document.getElementById("scanTs").textContent = json.ts;
    document.getElementById("btnRefresh").style.display = "";
    document.getElementById("btnTgScan").style.display = "";
    renderScan(json.data);
  } catch(e) {
    el.innerHTML = `<div class="empty"><div class="empty-icon">❌</div>${e.message}</div>`;
  }
  document.getElementById("btnScan").disabled = false;
}

function renderScan(data) {
  if (!data.length) {
    document.getElementById("scanResult").innerHTML = `<div class="empty"><div class="empty-icon">😴</div>今日無符合條件的標的</div>`;
    return;
  }
  const wl = getWatchlist();
  // 觀察名單的幣置頂
  data.sort((a, b) => {
    const aw = wl.includes(a.coin) ? 0 : 1;
    const bw = wl.includes(b.coin) ? 0 : 1;
    return aw !== bw ? aw - bw : b.change - a.change;
  });
  const groups = {sniper: [], track: [], alert: []};
  data.forEach(d => {
    if (d.change >= 50) groups.alert.push(d);
    else if (d.change >= 15) groups.track.push(d);
    else groups.sniper.push(d);
  });
  let html = `<div class="content">`;
  const sections = [
    {key:"sniper", label:"🟢 狙擊區｜5~15%", cls:"zone-green"},
    {key:"track",  label:"🟡 跟蹤區｜15~50%", cls:"zone-yellow"},
    {key:"alert",  label:"🔴 警戒區｜>50%", cls:"zone-red"},
  ];
  sections.forEach(({key, label, cls}) => {
    if (!groups[key].length) return;
    html += `<div class="card"><div class="card-header"><h2>${label}</h2></div><div class="card-body">`;
    groups[key].slice(0,10).forEach(d => {
      const inWl = wl.includes(d.coin);
      html += `<div class="scan-row">
        <div class="scan-zone ${cls}" onclick="quickAnalyze('${d.coin}')"></div>
        <div class="scan-info" onclick="quickAnalyze('${d.coin}')">
          <div class="scan-coin">${d.coin}${inWl ? ' <span style="font-size:10px;font-weight:700;background:rgba(240,185,11,0.18);color:var(--acc);border-radius:4px;padding:1px 5px;vertical-align:middle">WL</span>' : ''}</div>
          <div class="scan-vol">${fmt(d.volume)} 成交量</div>
        </div>
        <div class="scan-right" style="display:flex;align-items:center;gap:4px">
          <div onclick="quickAnalyze('${d.coin}')">
            <div class="scan-chg" style="color:${d.change>=0?'var(--green)':'var(--red)'}">${d.change>=0?'+':''}${d.change.toFixed(2)}%</div>
            <div class="scan-price">${fmtPrice(d.price)}</div>
          </div>
          <button class="btn-star" data-wl-coin="${d.coin}" onclick="event.stopPropagation();toggleWatchlist('${d.coin}',this)" title="${inWl ? '移除觀察' : '加入觀察'}">${inWl ? '⭐' : '☆'}</button>
        </div>
      </div>`;
    });
    html += `</div></div>`;
  });
  html += `</div>`;
  document.getElementById("scanResult").innerHTML = html;
}

let _prevTab = null;        // 記錄從哪個頁面跳過來
let _lastAnalysis = null;   // 最後一次分析結果（倉位計算用）

function quickAnalyze(coin) {
  // 記錄來源頁（掃描頁跳過來就記 'scan'）
  const activeTab = document.querySelector('.tab.active');
  const tabIdx = [...document.querySelectorAll('.tab')].indexOf(activeTab);
  _prevTab = tabIdx === 0 ? 'scan' : tabIdx === 2 ? 'watchlist' : null;

  document.querySelectorAll(".tab")[1].click();
  document.getElementById("coinInput").value = coin;
  runAnalyze();
  // 讓手機返回鍵可以退回上一頁
  history.pushState({lana: 'analyze'}, '');
}

function goBack() {
  if (_prevTab === 'scan') {
    document.querySelectorAll(".tab")[0].click();
  } else if (_prevTab === 'watchlist') {
    document.querySelectorAll(".tab")[2].click();
  } else {
    // 手動點進來，沒有來源，就清空分析頁回到初始
    document.getElementById("analyzeResult").innerHTML =
      `<div class="empty"><div class="empty-icon">🔍</div>輸入幣種代號<br>例如 BIO、ORDI、ORCA</div>`;
    document.getElementById("coinInput").value = '';
  }
  _prevTab = null;
}

// 手機返回鍵觸發 popstate
window.addEventListener('popstate', function(e) {
  // 如果目前顯示的是分析結果（有 back-bar），就攔截返回
  if (document.querySelector('.back-bar')) {
    goBack();
  }
});

// ── 深度分析 ──────────────────────────────────────────────
async function runAnalyze() {
  const coin = document.getElementById("coinInput").value.trim().toUpperCase();
  if (!coin) return;
  const el = document.getElementById("analyzeResult");
  el.innerHTML = `<div class="loading"><div class="spinner"></div>分析 ${coin} 中...</div>`;
  document.getElementById("btnAnalyze").disabled = true;
  try {
    const res = await fetch(`/api/analyze/${coin}`);
    const json = await res.json();
    if (!json.ok) throw new Error(json.error);
    renderAnalysis(json.data);
  } catch(e) {
    el.innerHTML = `<div class="empty"><div class="empty-icon">❌</div>${e.message}</div>`;
  }
  document.getElementById("btnAnalyze").disabled = false;
}

function maRow(label, val, price) {
  const diff = ((price - val) / val * 100);
  const col = diff > 0 ? "var(--green)" : "var(--red)";
  return `<div class="ma-row">
    <span class="ma-label">${label}</span>
    <span class="ma-val">${fmtPrice(val)}</span>
    <span class="ma-diff" style="color:${col}">${diff >= 0 ? '+' : ''}${diff.toFixed(1)}%</span>
  </div>`;
}

function buildLsAdvice(score, ld, d) {
  // 主建議
  let main, mainColor;
  if (score >= 80) {
    main = '💎 積極布局：各指標全面看多，可分批建倉，止損設 MA30 下方 3%';
    mainColor = '#FFD700';
  } else if (score >= 65) {
    main = '🟢 謹慎跟進：技術偏強，小倉位試水，等量能確認再加碼';
    mainColor = '#0ecb81';
  } else if (score >= 50) {
    main = '🟡 觀望等待：訊號混合，不急於進場，等待更明確的突破訊號';
    mainColor = '#f0b90b';
  } else if (score >= 35) {
    main = '🟠 暫勿追多：整體偏弱，若持倉建議控制比例，等待趨勢轉強';
    mainColor = '#FF8C00';
  } else {
    main = '🔴 規避風險：多項指標看空，建議空倉觀望或嚴格止損';
    mainColor = '#f6465d';
  }

  // 各項弱點提示
  const tips = [];
  if ((ld.vol || 0) <= 6)
    tips.push('<span class="ls-tip">⚡ <strong>量能不足（' + (ld.vol||0) + '/20）</strong>：價升量縮是警訊，等成交量放大 1.5x 以上再跟進更安全</span>');
  if ((ld.trend || 0) < 15)
    tips.push('<span class="ls-tip">📉 <strong>趨勢偏弱（' + (ld.trend||0) + '/25）</strong>：MA7 未站上 MA30，方向不明，不宜重倉</span>');
  if (d.bb_position === 'above_upper')
    tips.push('<span class="ls-tip">🎯 <strong>突破布林上軌</strong>：短線超漲區，等回踩布林中軌（' + fmtPrice(d.bb_mid) + '）附近再考慮</span>');
  if (d.bb_position === 'below_lower')
    tips.push('<span class="ls-tip">🔍 <strong>跌破布林下軌</strong>：超賣區可能反彈，但要確認 RSI 同步回升才進場</span>');
  if ((ld.risk || 0) <= 8)
    tips.push('<span class="ls-tip">⚠️ <strong>多項風險信號（' + (ld.risk||0) + '/20）</strong>：建議倉位不超過 5%，並設好止損</span>');
  if (d.rsi && d.rsi > 70)
    tips.push('<span class="ls-tip">🌡️ <strong>RSI 超買（' + d.rsi.toFixed(1) + '）</strong>：短線追高風險高，等 RSI 回落 60 以下再看</span>');
  if (d.funding_rate && d.funding_rate > 0.05)
    tips.push('<span class="ls-tip">💸 <strong>資金費率偏高（' + d.funding_rate + '%）</strong>：多頭擁擠，持倉成本高，注意多單爆倉風險</span>');
  if (tips.length === 0 && score >= 65)
    tips.push('<span class="ls-tip">✅ 各項指標無明顯弱點，可按計劃執行</span>');

  return `<div class="ls-advice-main" style="color:${mainColor}">${main}</div>
          <div class="ls-advice-tips">${tips.join('')}</div>`;
}

【均線】${d.ma_bull ? '多頭排列 ✅' : '非多頭 ⚠️'}  MA7:${fmtPrice(d.ma7)} / MA30:${fmtPrice(d.ma30)} / MA120:${fmtPrice(d.ma120)}

async function sendEmail(coin, text) {
  toast("寄送中...");
  try {
    const res = await fetch("/api/email", {
      method: "POST",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify({
        subject: `[LANA 深度分析] ${coin} ${new Date().toLocaleString('zh-TW')}`,
        text: text
      })
    });
    const json = await res.json();
    toast(json.ok ? "✅ 報告已寄出！" : "❌ 寄送失敗：" + json.error);
  } catch(e) {
    toast("❌ 網路錯誤");
  }
}

async function sendScanTelegram() {
  const rows = document.querySelectorAll('.scan-row');
  if (!rows.length) { toast('尚無掃描結果'); return; }
  const wl = getWatchlist();
  const lines = [];
  lines.push(`📡 <b>LANA 市場掃描</b>  ${new Date().toLocaleString('zh-TW')}`);
  lines.push('');
  // 觀察名單先列
  document.querySelectorAll('.scan-coin').forEach(el => {
    const coin = el.textContent.replace('WL','').replace('⭐','').trim();
    const row = el.closest('.scan-row');
    const chg  = row.querySelector('.scan-chg')?.textContent || '';
    const price = row.querySelector('.scan-price')?.textContent || '';
    const vol  = row.querySelector('.scan-vol')?.textContent || '';
    const flag = wl.includes(coin) ? '⭐' : '  ';
    lines.push(`${flag} ${coin}  ${chg}  ${price}  ${vol}`);
  });
  lines.push('');
  lines.push('⚠️ 僅供參考，不構成投資建議');
  await sendTelegram(lines.join('\n'));
}

async function sendTelegram(text) {
  toast("Telegram 推播中...");
  try {
    const res = await fetch("/api/telegram", {
      method: "POST",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify({ text: text })
    });
    const json = await res.json();
    toast(json.ok ? "✅ 已推播到 Telegram！" : "❌ 推播失敗：" + json.error);
  } catch(e) {
    toast("❌ 網路錯誤");
  }
}

// ── 觀察名單 ─────────────────────────────────────────────
async function loadWatchlist() {
  const WATCHLIST = getWatchlist();
  const el = document.getElementById("wlRows");
  if (!WATCHLIST.length) {
    el.innerHTML = `<div class="empty"><div class="empty-icon">👁</div>尚無追蹤標的<br><small style="color:var(--muted)">從市場掃描或深度分析按 ⭐ 加入</small></div>`;
    return;
  }
  el.innerHTML = `<div class="loading"><div class="spinner"></div>更新中...</div>`;
  const results = await Promise.all(WATCHLIST.map(async coin => {
    try {
      const r = await fetch(`/api/analyze/${coin}`);
      const j = await r.json();
      return j.ok ? j.data : null;
    } catch { return null; }
  }));
  el.innerHTML = "";
  results.forEach((d, i) => {
    const coin = WATCHLIST[i];
    if (!d) {
      el.innerHTML += `<div class="scan-row">
        <div class="scan-info"><div class="scan-coin">${coin}</div><div class="scan-vol">載入失敗</div></div>
        <button class="btn-remove" onclick="removeFromWatchlist('${coin}')" title="移除">✕</button>
      </div>`;
      return;
    }
    const riskColor = {safe:"var(--green)",low:"var(--green)",medium:"var(--yellow)",high:"var(--red)",extreme:"var(--red)"}[d.risk_level];
    el.innerHTML += `<div class="scan-row" onclick="quickAnalyze('${d.coin}')">
      <div class="scan-zone" style="background:${riskColor}"></div>
      <div class="scan-info">
        <div class="scan-coin">${d.coin}</div>
        <div class="scan-vol">RSI ${d.rsi?.toFixed(0) ?? '—'} | 量 ${d.vol_ratio ? d.vol_ratio+'x' : '—'} | ${d.ma_bull ? '多排✅' : '整理⚠️'}</div>
      </div>
      <div class="scan-right" style="display:flex;align-items:center;gap:4px">
        <div>
          <div class="scan-chg" style="color:${d.change_24h >= 0 ? 'var(--green)' : 'var(--red)'}">${chgStr(d.change_24h)}</div>
          <div class="scan-price">${fmtPrice(d.price)}</div>
        </div>
        <button class="btn-remove" onclick="event.stopPropagation();removeFromWatchlist('${d.coin}')" title="移除">✕</button>
      </div>
    </div>`;
  });
}

// ── 倉位計算機 ────────────────────────────────────────────
function calcPosition() {
  const d = _lastAnalysis;
  if (!d) return;
  const maxLoss  = parseFloat(document.getElementById('posMaxLoss').value) || 200;
  const leverage = parseFloat(document.getElementById('posLeverage').value) || 1;
  const entry    = d.price;
  const stopLoss = d.support2 * 0.97;
  const stopDist = (entry - stopLoss) / entry;      // 止損距離%
  if (stopDist <= 0) { document.getElementById('posResult').innerHTML = '<div style="color:var(--red);font-size:12px">止損位異常，無法計算</div>'; return; }
  const margin   = maxLoss / (leverage * stopDist); // 需投入保證金
  const exposure = margin * leverage;               // 實際倉位USD
  const qty      = exposure / entry;                // 幣數量
  const tp1      = d.resistance;
  const tp2      = tp1 * 1.12;
  const rr       = ((tp1 - entry) / (entry - stopLoss)).toFixed(2);
  const maxLossCheck = exposure * stopDist;

  document.getElementById('posResult').innerHTML = `
    <div class="pos-result-grid">
      <div class="pos-item"><div class="pos-label">進場價</div><div class="pos-val">${fmtPrice(entry)}</div></div>
      <div class="pos-item"><div class="pos-label">止損價</div><div class="pos-val" style="color:var(--red)">${fmtPrice(stopLoss)}</div></div>
      <div class="pos-item"><div class="pos-label">止損距離</div><div class="pos-val">${(stopDist*100).toFixed(1)}%</div></div>
      <div class="pos-item"><div class="pos-label">建議倉位（USD）</div><div class="pos-val" style="color:var(--acc)">$${margin.toFixed(0)}</div></div>
      <div class="pos-item"><div class="pos-label">幣的數量</div><div class="pos-val">${qty.toFixed(4)}</div></div>
      <div class="pos-item"><div class="pos-label">預期最大虧損</div><div class="pos-val" style="color:var(--red)">$${maxLossCheck.toFixed(1)}</div></div>
      <div class="pos-item"><div class="pos-label">止盈1（阻力位）</div><div class="pos-val" style="color:var(--green)">${fmtPrice(tp1)}</div></div>
      <div class="pos-item"><div class="pos-label">止盈2（+12%）</div><div class="pos-val" style="color:var(--green)">${fmtPrice(tp2)}</div></div>
    </div>
    <div class="pos-rr">風險回報比 1 : ${rr}</div>`;
}

function copyPosition() {
  const d = _lastAnalysis;
  if (!d) return;
  const maxLoss  = parseFloat(document.getElementById('posMaxLoss').value) || 200;
  const leverage = parseFloat(document.getElementById('posLeverage').value) || 1;
  const entry    = d.price;
  const stopLoss = d.support2 * 0.97;
  const stopDist = (entry - stopLoss) / entry;
  const margin   = maxLoss / (leverage * stopDist);
  const exposure = margin * leverage;
  const qty      = exposure / entry;
  const tp1      = d.resistance;
  const tp2      = tp1 * 1.12;
  const rr       = ((tp1 - entry) / (entry - stopLoss)).toFixed(2);
  const lvText   = leverage === 1 ? '現貨 1x' : `合約 ${leverage}x`;
  const text = `【LANA 倉位計算】${d.coin}  ${new Date().toLocaleString('zh-TW')}
進場：${fmtPrice(entry)}  止損：${fmtPrice(stopLoss)}（-${(stopDist*100).toFixed(1)}%）
類型：${lvText}  最大虧損：$${maxLoss}
建議保證金：$${margin.toFixed(0)}  幣量：${qty.toFixed(4)}
止盈1：${fmtPrice(tp1)}  止盈2：${fmtPrice(tp2)}
風險回報比：1:${rr}`;
  navigator.clipboard.writeText(text).then(() => toast('📋 已複製到剪貼簿'));
}

// ── 交易日誌 ─────────────────────────────────────────────
let _jPreviewData = null;

async function jFetchPreview() {
  const coin = document.getElementById('jCoin').value;
  const el   = document.getElementById('jPreview');
  if (!coin) { el.textContent = '選幣後自動帶入 LANA Score 與現價'; _jPreviewData = null; return; }
  el.textContent = '載入中...';
  try {
    const r = await fetch(`/api/analyze/${coin}`);
    const j = await r.json();
    if (!j.ok) throw new Error(j.error);
    _jPreviewData = j.data;
    el.innerHTML = `<span style="color:var(--acc);font-weight:700">${coin}</span>  現價 <b>${fmtPrice(j.data.price)}</b>  LANA Score <b style="color:${j.data.lana_score>=65?'var(--green)':j.data.lana_score>=50?'var(--yellow)':'var(--red)'}">${j.data.lana_score}/100</b>  ${j.data.lana_grade}`;
  } catch(e) { el.textContent = '載入失敗：' + e.message; }
}

async function submitJournal() {
  const coin      = document.getElementById('jCoin').value;
  const sentiment = document.getElementById('jSentiment').value;
  const reason    = document.getElementById('jReason').value;
  if (!coin)      { toast('請選擇幣種'); return; }
  if (!sentiment) { toast('請選擇當下感覺'); return; }
  const btn = document.getElementById('jSubmitBtn');
  btn.disabled = true; btn.textContent = '記錄中...';
  try {
    const r = await fetch('/api/journal/add', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({coin, sentiment, reason})
    });
    const j = await r.json();
    if (!j.ok) throw new Error(j.error);
    toast('✅ 已記錄！24小時後自動驗證');
    document.getElementById('jSentiment').value = '';
    document.getElementById('jReason').value = '';
    loadJournal();
  } catch(e) { toast('❌ ' + e.message); }
  btn.disabled = false; btn.textContent = '📝 記錄下來';
}

async function loadJournal() {
  const r = await fetch('/api/journal');
  const j = await r.json();
  if (!j.ok) return;
  renderJournal(j.entries);
}

function renderJournal(entries) {
  const el = document.getElementById('journalList');
  if (!entries.length) {
    el.innerHTML = `<div class="empty"><div class="empty-icon">📔</div>尚無紀錄<br><small style="color:var(--muted)">寫下你今天注意到的幣</small></div>`;
    return;
  }
  const sentMap = { '很想買':'sent-buy', '觀望':'sent-watch', '怕了':'sent-fear', '已經漲太多':'sent-high' };
  let html = '';
  // 按日期分組
  const groups = {};
  entries.forEach(e => {
    const day = e.ts_local ? e.ts_local.split(' ')[0] : '—';
    if (!groups[day]) groups[day] = [];
    groups[day].push(e);
  });
  Object.keys(groups).forEach(day => {
    html += `<div style="padding:8px 16px 2px;font-size:11px;color:var(--muted);font-weight:700">${day}</div>`;
    groups[day].forEach(e => {
      const sc = sentMap[e.sentiment] || 'sent-watch';
      const pnlColor = (e.pnl_pct || 0) > 0 ? 'var(--green)' : (e.pnl_pct || 0) < 0 ? 'var(--red)' : 'var(--muted)';
      const nowTs = Date.now();
      const entryTs = new Date(e.ts).getTime();
      const hoursLeft = Math.max(0, Math.ceil((entryTs + 86400000 - nowTs) / 3600000));
      html += `<div class="jentry">
        <div class="jentry-head">
          <span class="jentry-coin">${e.coin}</span>
          <span class="jentry-ts">${e.ts_local || ''}</span>
        </div>
        <div class="jentry-body">
          <span class="badge-sentiment ${sc}">${e.sentiment}</span>
          &nbsp; 進場價 <b>${fmtPrice(e.price_at)}</b> &nbsp; LANA <b>${e.lana_score}/100</b> ${e.lana_grade || ''}
          ${e.reason ? `<br><span style="color:var(--muted)">💬 ${e.reason}</span>` : ''}
        </div>
        ${e.validated
          ? `<div class="jentry-result">
               <span style="color:${pnlColor};font-weight:700">${e.pnl_pct != null ? (e.pnl_pct > 0 ? '+' : '') + e.pnl_pct.toFixed(1) + '%' : '—'}</span>
               <span style="color:var(--muted)">→ ${fmtPrice(e.price_24h)}</span>
               <span class="jentry-decision" style="margin-left:auto">${e.decision || ''}</span>
             </div>`
          : `<div class="jentry-result"><span class="pending-badge">⏳ ${hoursLeft}h 後驗證</span></div>`
        }
      </div>`;
    });
  });
  el.innerHTML = html;
}

async function validateJournal() {
  toast('驗證中...');
  const r = await fetch('/api/journal/validate', {method:'POST'});
  const j = await r.json();
  if (j.ok) {
    toast(j.updated ? `✅ 驗證了 ${j.updated} 筆` : '尚無到期紀錄');
    renderJournal(j.entries);
  }
}

  const j = await r.json();

function initJournalPage() {
  // 填充觀察名單到幣種下拉
  const sel = document.getElementById('jCoin');
  const wl  = getWatchlist();
  sel.innerHTML = '<option value="">— 選擇幣種 —</option>';
  // 觀察名單置頂
  wl.forEach(c => sel.innerHTML += `<option value="${c}">⭐ ${c}</option>`);
  // 常見幣補充（不重複）
  ['BTC','ETH','SOL','BNB','DOGE','PEPE','WIF','BONK'].filter(c => !wl.includes(c))
    .forEach(c => sel.innerHTML += `<option value="${c}">${c}</option>`);
  loadJournal();
}
